<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>泓泽宜通 - HongZe-SCMS</title>
  <!-- 公共样式模板：全局变量 / 布局 / 导航 / KPI 卡，保证各模块风格统一 -->
  <link rel="stylesheet" href="css/common.css" />
  <!-- 首页独立样式：问候条 / 模块入口 / 趋势图 / 最新动态 -->
  <link rel="stylesheet" href="css/index.css" />
</head>
<body>
  <div class="layout">
    <!-- 左侧导航栏 -->
    <aside class="sidebar">
      <!-- 系统名称 -->
      <div class="brand">
        <div class="brand-name">泓泽宜通</div>
        <div class="brand-sub">HongZe-SCMS</div>
      </div>

      <!-- 一级导航（由 common/fetch.js 动态加载 common/navbar.html） -->
      <div id="navbar"></div>
    </aside>

    <!-- 主内容区 -->
    <main class="main">
      <!-- 问候条 -->
      <section class="home-greet">
        <div class="greet-info">
          <div class="greet-title" id="greetTitle">欢迎回来</div>
          <div class="greet-sub">泓泽宜通供应链管理系统 · 数据总览与业务入口</div>
        </div>
        <div class="greet-date" id="greetDate">—</div>
      </section>

      <!-- 核心指标（真实数据聚合，点击卡片进入对应模块） -->
      <section class="home-kpis">
        <div class="kpi-card blue">
          <div class="kpi-info">
            <div class="kpi-label">合同总金额</div>
            <div class="kpi-value"><span id="kpiAmount">¥0</span><span class="kpi-unit" id="kpiAmountUnit">万</span></div>
            <div class="kpi-trend" id="kpiAmountNote">—</div>
          </div>
          <div class="kpi-icon">
            <svg viewBox="0 0 24 24"><path d="M6 3l6 8 6-8"/><path d="M12 11v10"/><path d="M7 13h10"/><path d="M7 17h10"/></svg>
          </div>
        </div>

        <div class="kpi-card">
          <div class="kpi-info">
            <div class="kpi-label">合同数量</div>
            <div class="kpi-value"><span id="kpiContracts">0</span><span class="kpi-unit" id="kpiContractsUnit">份</span></div>
            <div class="kpi-trend" id="kpiContractsNote">—</div>
          </div>
          <div class="kpi-icon">
            <svg viewBox="0 0 24 24"><path d="M8 3h9a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5"/><path d="M9 8h6"/><path d="M9 12h6"/><path d="M9 16h4"/></svg>
          </div>
        </div>

        <div class="kpi-card green">
          <div class="kpi-info">
            <div class="kpi-label">在用矿山</div>
            <div class="kpi-value"><span id="kpiMines">0</span><span class="kpi-unit" id="kpiMinesUnit">座</span></div>
            <div class="kpi-trend" id="kpiMinesNote">—</div>
          </div>
          <div class="kpi-icon green">
            <svg viewBox="0 0 24 24"><path d="M3 20L10 6l4 7 3-4 4 11z"/><path d="M8 20l3-6"/></svg>
          </div>
        </div>

        <div class="kpi-card orange">
          <div class="kpi-info">
            <div class="kpi-label">在途航次</div>
            <div class="kpi-value"><span id="kpiVoyages">0</span><span class="kpi-unit" id="kpiVoyagesUnit">个</span></div>
            <div class="kpi-trend" id="kpiVoyagesNote">—</div>
          </div>
          <div class="kpi-icon orange">
            <svg viewBox="0 0 24 24"><path d="M4 13h16l-2 5H6z"/><path d="M8 13V8h8v5"/><path d="M12 8V4"/><path d="M2 21c1.5-1.2 3-1.2 4.5 0s3 1.2 4.5 0 3-1.2 4.5 0 3 1.2 4.5 0"/></svg>
          </div>
        </div>
      </section>

      <!-- 主体两栏：左模块入口 + 趋势，右最新动态 -->
      <div class="home-body">
        <div class="home-main">
          <!-- 业务模块入口矩阵 -->
          <section class="home-panel">
            <div class="panel-head">
              <div class="panel-title">业务模块</div>
              <div class="panel-sub">点击卡片进入对应模块</div>
            </div>
            <div class="module-grid" id="moduleGrid"></div>
          </section>

          <!-- 合同金额趋势 -->
          <section class="home-panel">
            <div class="panel-head">
              <div class="panel-title">合同金额趋势</div>
              <div class="panel-sub">近 6 个月签订合同金额（万元）</div>
            </div>
            <div class="trend-wrap" id="trendChart"></div>
          </section>
        </div>

        <aside class="home-side">
          <!-- 最新动态 -->
          <section class="home-panel">
            <div class="panel-head">
              <div class="panel-title">最新动态</div>
              <div class="panel-sub">合同 / 矿山 / 航次</div>
            </div>
            <ul class="activity-list" id="activityList"></ul>
          </section>
        </aside>
      </div>
    </main>
  </div>

  <!-- 公共导航栏加载脚本 -->
  <script src="common/fetch.js"></script>
  <!-- 首页逻辑：真实数据聚合 + 模块入口 + 趋势图 + 最新动态 -->
  <script src="index.js"></script>
</body>
</html>
