<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>泓泽宜通 - HongZe-SCMS</title>
  <style>
    /* ===== 设计规范变量（ui-standard-1.md）===== */
    :root {
      --color-primary: #4080FF;
      --color-primary-light: #E8F0FF;
      --color-primary-dark: #2B68D9;
      --color-success: #00B42A;
      --color-warning: #FF7D00;
      --color-danger: #F53F3F;
      --color-info: #86909C;

      /* 概览指标卡片浅辅助底色 */
      --assist-bg-orange: #FFF4E8;
      --assist-bg-purple: #F3EEFF;
      --assist-bg-red: #FFECEC;
      --assist-bg-green: #E8F9F2;

      --gray-100: #FFFFFF;
      --gray-200: #F2F3F5;
      --gray-300: #E5E6EB;
      --gray-400: #C9CDD4;
      --gray-500: #86909C;
      --gray-600: #4E5969;
      --gray-700: #272E3B;
      --gray-800: #1D2129;

      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;

      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;

      --shadow-card: 0 2px 12px rgba(0, 0, 0, 0.04);
      --shadow-hover: 0 4px 16px rgba(0, 0, 0, 0.06);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      color: var(--gray-600);
      background: var(--gray-200);
    }

    /* ===== 布局 ===== */
    .layout {
      display: flex;
      min-height: 100vh;
    }

    /* ===== 左侧导航栏 ===== */
    .sidebar {
      width: 240px;
      flex-shrink: 0;
      background: var(--gray-100);
      border-right: 1px solid var(--gray-300);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    /* 系统名称区 */
    .brand {
      padding: var(--space-lg) var(--space-md) var(--space-md);
      border-bottom: 1px solid var(--gray-300);
    }

    .brand-name {
      font-size: 24px;        /* H1 */
      font-weight: 600;
      line-height: 1.3;
      color: var(--gray-800);
      letter-spacing: 2px;
    }

    .brand-sub {
      margin-top: var(--space-xs);
      font-size: 12px;        /* Caption */
      font-weight: 400;
      color: var(--gray-500);
      letter-spacing: 1px;
    }

    /* ===== 一级导航 ===== */
    .nav {
      flex: 1;
      padding: var(--space-md) var(--space-sm);
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      height: 40px;
      padding: 0 var(--space-md);
      border-radius: var(--radius-sm);
      font-size: 14px;        /* Body2 */
      color: var(--gray-600);
      text-decoration: none;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.2s, color 0.2s;
    }

    .nav-item .icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-item .label { flex: 1; }

    /* 展开箭头 */
    .nav-item .arrow {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.2s;
    }

    .nav-group.open > .nav-item .arrow { transform: rotate(90deg); }

    .nav-item:hover {
      background: var(--gray-200);
      color: var(--gray-700);
    }

    .nav-item.active {
      background: var(--color-primary-light);
      color: var(--color-primary);
      font-weight: 500;
    }

    /* 含展开子菜单时父级文字加重 */
    .nav-group.open > .nav-item:not(.active) { color: var(--gray-800); font-weight: 500; }

    /* ===== 二级菜单 ===== */
    .subnav {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.25s ease;
    }

    .nav-group.open .subnav { grid-template-rows: 1fr; }

    .subnav-inner { overflow: hidden; }

    .subnav-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
      padding: var(--space-xs) 0 var(--space-sm);
    }

    .nav-sub-item {
      display: flex;
      align-items: center;
      height: 36px;
      margin: 0 var(--space-sm);
      padding: 0 var(--space-sm) 0 40px; /* 与父级文字对齐：16(内边距)+16(图标)+8(间距) */
      border-radius: var(--radius-sm);
      font-size: 14px;
      color: var(--gray-600);
      text-decoration: none;
      cursor: pointer;
      user-select: none;
      position: relative;
      transition: background-color 0.2s, color 0.2s;
    }

    /* 子项左侧指示点 */
    .nav-sub-item::before {
      content: "";
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--gray-400);
      position: absolute;
      left: 24px;
      top: 50%;
      transform: translateY(-50%);
      transition: background-color 0.2s;
    }

    .nav-sub-item:hover {
      background: var(--gray-200);
      color: var(--gray-700);
    }

    .nav-sub-item.active {
      background: var(--color-primary-light);
      color: var(--color-primary);
      font-weight: 500;
    }

    .nav-sub-item.active::before { background: var(--color-primary); }

    /* ===== 主内容区 ===== */
    .main {
      flex: 1;
      padding: var(--space-lg);
    }

    /* ===== 首页 KPI 数据面板 ===== */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-lg);
    }

    .kpi-card {
      background: var(--gray-100);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      padding: var(--space-md);
      display: flex;
      align-items: center;
      gap: var(--space-md);
      transition: box-shadow 0.2s;
    }

    .kpi-card:hover { box-shadow: var(--shadow-hover); }

    .kpi-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-lg);
      background: var(--color-primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .kpi-icon svg {
      width: 24px;
      height: 24px;
      stroke: var(--color-primary);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* 指标卡片浅辅助底色变体 */
    .kpi-icon.orange { background: var(--assist-bg-orange); }
    .kpi-icon.orange svg { stroke: var(--color-warning); }

    .kpi-icon.green { background: var(--assist-bg-green); }
    .kpi-icon.green svg { stroke: var(--color-success); }

    /* 概览指标卡片：浅橙整卡底色 */
    .kpi-card.orange { background: var(--assist-bg-orange); }
    .kpi-card.orange .kpi-icon { background: var(--gray-100); }

    .kpi-card.blue { background: var(--color-primary-light); }
    .kpi-card.blue .kpi-icon { background: var(--gray-100); }

    .kpi-card.green { background: var(--assist-bg-green); }
    .kpi-card.green .kpi-icon { background: var(--gray-100); }

    .kpi-info { flex: 1; min-width: 0; }

    .kpi-label {
      font-size: 14px;        /* Body2 */
      color: var(--gray-500);
    }

    .kpi-value {
      margin-top: var(--space-xs);
      font-size: 24px;        /* H1 */
      font-weight: 600;
      line-height: 1.3;
      color: var(--gray-800);
      font-variant-numeric: tabular-nums;
    }

    .kpi-trend {
      margin-top: var(--space-xs);
      font-size: 12px;        /* Caption */
      color: var(--gray-500);
    }

    .kpi-trend.up   { color: var(--color-success); }
    .kpi-trend.down { color: var(--color-danger); }

    .placeholder-card {
      background: var(--gray-100);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      padding: var(--space-md);
      min-height: 200px;
    }

    .page-path {
      font-size: 12px;        /* Caption */
      color: var(--gray-500);
      margin-bottom: var(--space-sm);
    }

    .page-title {
      font-size: 20px;        /* H2 */
      font-weight: 600;
      color: var(--gray-800);
      line-height: 1.3;
    }

    .page-body {
      margin-top: var(--space-md);
      font-size: 14px;
      color: var(--gray-500);
    }
  </style>
</head>
<body>
  <div class="layout">
    <!-- 左侧导航栏 -->
    <aside class="sidebar">
      <!-- 系统名称 -->
      <div class="brand">
        <div class="brand-name">泓泽宜通</div>
        <div class="brand-sub">HongZe-SCMS</div>
      </div>

      <!-- 一级导航 -->
      <nav class="nav">
        <a class="nav-item active" data-path="首页">
          <svg class="icon" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
          <span class="label">首页</span>
        </a>

        <a class="nav-item" data-path="客户管理">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.5c2.1.7 3.5 2.4 3.5 5"/></svg>
          <span class="label">客户管理</span>
        </a>

        <!-- 价格指数管理（含二级菜单） -->
        <div class="nav-group">
          <a class="nav-item has-children">
            <svg class="icon" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
            <span class="label">价格指数管理</span>
            <svg class="arrow" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
          </a>
          <div class="subnav">
            <div class="subnav-inner">
              <div class="subnav-list">
                <a class="nav-sub-item" data-path="价格指数管理 / 汽运价格指数">汽运价格指数</a>
                <a class="nav-sub-item" data-path="价格指数管理 / 火运价格指数">火运价格指数</a>
                <a class="nav-sub-item" data-path="价格指数管理 / 铁矿石价格指数">铁矿石价格指数</a>
              </div>
            </div>
          </div>
        </div>

        <a class="nav-item" data-path="订单管理">
          <svg class="icon" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8"/><path d="M8 12h8"/><path d="M8 16h5"/></svg>
          <span class="label">订单管理</span>
        </a>

        <a class="nav-item" data-path="合同管理">
          <svg class="icon" viewBox="0 0 24 24"><path d="M8 3h9a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5"/><path d="M9 8h6"/><path d="M9 12h6"/><path d="M9 16h4"/></svg>
          <span class="label">合同管理</span>
        </a>

        <a class="nav-item" data-path="运输调度管理">
          <svg class="icon" viewBox="0 0 24 24"><path d="M2 6h12v11H2z"/><path d="M14 10h4l3 3.5V17h-7"/><circle cx="6.5" cy="18.5" r="1.8"/><circle cx="17" cy="18.5" r="1.8"/></svg>
          <span class="label">运输调度管理</span>
        </a>

        <!-- 数据分析（含二级菜单） -->
        <div class="nav-group">
          <a class="nav-item has-children">
            <svg class="icon" viewBox="0 0 24 24"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M2 20h20"/></svg>
            <span class="label">数据分析</span>
            <svg class="arrow" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
          </a>
          <div class="subnav">
            <div class="subnav-inner">
              <div class="subnav-list">
                <a class="nav-sub-item" data-path="数据分析 / 调度数据分析">调度数据分析</a>
                <a class="nav-sub-item" data-path="数据分析 / 财务数据分析">财务数据分析</a>
              </div>
            </div>
          </div>
        </div>
      </nav>
    </aside>

    <!-- 主内容区 -->
    <main class="main">
      <!-- 首页：KPI 数据面板 -->
      <section id="homePage">
        <div class="kpi-grid">
          <div class="kpi-card orange">
            <div class="kpi-info">
              <div class="kpi-label">总交易额</div>
              <div class="kpi-value" data-target="12854600" data-prefix="¥">¥0</div>
              <div class="kpi-trend up">较上月 ↑ 12.5%</div>
            </div>
            <div class="kpi-icon orange">
              <svg viewBox="0 0 24 24"><path d="M6 3l6 8 6-8"/><path d="M12 11v10"/><path d="M7 13h10"/><path d="M7 17h10"/></svg>
            </div>
          </div>

          <div class="kpi-card blue">
            <div class="kpi-info">
              <div class="kpi-label">总订单数</div>
              <div class="kpi-value" data-target="3586">0</div>
              <div class="kpi-trend up">较上月 ↑ 8.2%</div>
            </div>
            <div class="kpi-icon">
              <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8"/><path d="M8 12h8"/><path d="M8 16h5"/></svg>
            </div>
          </div>

          <div class="kpi-card green">
            <div class="kpi-info">
              <div class="kpi-label">客户数</div>
              <div class="kpi-value" data-target="1268">0</div>
              <div class="kpi-trend up">较上月 ↑ 3.6%</div>
            </div>
            <div class="kpi-icon green">
              <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.5c2.1.7 3.5 2.4 3.5 5"/></svg>
            </div>
          </div>
        </div>

        <div class="placeholder-card" style="margin-top: var(--space-lg);">
          <div class="page-body" style="margin-top: 0;">数据概览图表区域（待开发）</div>
        </div>
      </section>

      <!-- 其他页面占位 -->
      <section id="otherPage" hidden>
        <div class="placeholder-card">
          <div class="page-path" id="pagePath">首页</div>
          <div class="page-title" id="pageTitle">首页</div>
          <div class="page-body">当前页面内容区域（待开发）</div>
        </div>
      </section>
    </main>
  </div>

  <script>
    // ===== 二级菜单展开/收起 =====
    document.querySelectorAll('.nav-group > .nav-item.has-children').forEach(parent => {
      parent.addEventListener('click', () => {
        parent.closest('.nav-group').classList.toggle('open');
      });
    });

    // ===== 数字滚动动画 =====
    function animateValue(el, target) {
      const prefix = el.dataset.prefix || '';
      const duration = 800;
      const start = performance.now();
      function frame(now) {
        const p = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - p, 3);
        el.textContent = prefix + Math.round(target * eased).toLocaleString('zh-CN');
        if (p < 1) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    // ===== 页面切换 =====
    const homePage = document.getElementById('homePage');
    const otherPage = document.getElementById('otherPage');
    let kpiAnimated = false;

    function showHome() {
      homePage.hidden = false;
      otherPage.hidden = true;
      if (!kpiAnimated) {
        kpiAnimated = true;
        document.querySelectorAll('.kpi-value').forEach(el =>
          animateValue(el, Number(el.dataset.target))
        );
      }
    }

    function showOther(path) {
      homePage.hidden = true;
      otherPage.hidden = false;
      const parts = path.split('/').map(s => s.trim());
      document.getElementById('pagePath').textContent = path;
      document.getElementById('pageTitle').textContent = parts[parts.length - 1];
    }

    // 一级无子菜单项 + 二级菜单项
    const clickableItems = document.querySelectorAll(
      '.nav-item:not(.has-children), .nav-sub-item'
    );

    clickableItems.forEach(item => {
      item.addEventListener('click', () => {
        // 更新选中态
        document.querySelectorAll('.nav-item.active, .nav-sub-item.active')
          .forEach(el => el.classList.remove('active'));
        item.classList.add('active');

        const path = item.dataset.path || item.querySelector('.label').textContent;
        if (path === '首页') showHome();
        else showOther(path);
      });
    });

    // 初始加载首页
    showHome();
  </script>
</body>
</html>
