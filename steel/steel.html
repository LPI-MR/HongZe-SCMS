          <!-- 区县分组统计 -->
          <div class="map-side">
            <div class="map-side-title">区县分布一览</div>

              <span class="map-legend-item"><i class="map-legend-dot" style="background:#5B8FD9"></i>钢企聚集核心</span>

      <!-- 钢厂总览 KPI -->
      <section class="kpi-grid" id="kpi-grid"></section>

      <!-- 钢厂列表 -->
      <section class="panel">
        <div class="panel-header">
          <div class="panel-title">钢厂列表</div>
          <div class="supplier-toolbar">
            <input id="supplier-search" class="search-input" type="text" placeholder="搜索钢厂名称 / 地址 / 主要产品" />
          </div>
        </div>
        <div class="supplier-grid" id="supplier-grid"></div>
      </section>
    </main>
  </div>

  <!-- 新增 / 编辑钢厂抽屉 -->
  <div class="drawer-mask" id="drawer-mask" hidden></div>
  <aside class="drawer" id="add-drawer" hidden aria-hidden="true">
    <div class="drawer-head">
      <div class="drawer-title" id="drawer-title">新增钢厂</div>
      <button id="drawer-close" type="button" class="drawer-close" aria-label="关闭">✕</button>
    </div>

    <form id="supplier-form" class="drawer-body" novalidate>
      <div class="form-item">
        <label class="form-label" for="f-name">钢厂名称 <span class="required">*</span></label>
        <input id="f-name" name="name" type="text" class="form-input" placeholder="请输入钢厂全称" maxlength="60" />
      </div>

      <div class="form-item">
        <label class="form-label" for="f-type">合作等级</label>
        <select id="f-type" name="type" class="form-input">
          <option value="长期合作">长期合作</option>
          <option value="稳定合作">稳定合作</option>
          <option value="潜在合作">潜在合作</option>
        </select>
      </div>

      <div class="form-item">
        <label class="form-label" for="f-contact">采购联系人</label>
        <input id="f-contact" name="contact" type="text" class="form-input" placeholder="请输入采购负责人姓名" maxlength="20" />
      </div>

      <div class="form-item">
        <label class="form-label" for="f-phone">采购联系电话</label>
        <input id="f-phone" name="phone" type="text" class="form-input" placeholder="手机号或座机号" maxlength="20" />
      </div>

      <div class="form-item">
        <label class="form-label" for="f-address">厂区 / 办公地址</label>
        <input id="f-address" name="address" type="text" class="form-input" placeholder="请输入钢厂地址" maxlength="100" />
      </div>

      <div class="form-item">
        <label class="form-label">经营指标（选填）</label>
        <div class="form-grid form-grid-2">
          <input id="f-capacity" name="capacity" type="text" class="form-input" placeholder="粗钢产能，如 600万吨/年" maxlength="40" />
          <input id="f-ore-demand" name="oreDemand" type="text" class="form-input" placeholder="矿石需求，如 950万吨/年" maxlength="40" />
          <input id="f-nature" name="nature" type="text" class="form-input" placeholder="企业性质，如 民营企业" maxlength="20" />
          <input id="f-founded" name="founded" type="text" class="form-input" placeholder="建厂时间，如 1992年" maxlength="20" />
        </div>
      </div>

      <div class="form-item">
        <label class="form-label">注册信息（选填）</label>
        <div class="form-grid form-grid-2">
          <input id="f-reg-time" name="regTime" type="text" class="form-input" placeholder="注册时间，如 1992-10-05" maxlength="20" />
          <input id="f-reg-capital" name="regCapital" type="text" class="form-input" placeholder="注册资本，如 25亿元" maxlength="30" />
          <input id="f-reg-address" name="regAddress" type="text" class="form-input" placeholder="注册地址" maxlength="100" />
        </div>
      </div>

      <div class="form-item">
        <label class="form-label" for="f-intro">钢厂简介</label>
        <textarea id="f-intro" name="intro" class="form-input form-textarea" rows="5" placeholder="简要介绍企业背景、装备与产能等，最多 300 字" maxlength="300"></textarea>
      </div>

      <div class="form-item">
        <label class="form-label" for="f-remark">备注</label>
        <textarea id="f-remark" name="remark" class="form-input form-textarea" rows="3" placeholder="选填，最多 100 字" maxlength="100"></textarea>
      </div>

      <div class="drawer-footer">
        <button type="button" class="btn-ghost" id="btn-cancel">取消</button>
        <button type="submit" class="btn-primary" id="btn-submit">保存钢厂</button>
      </div>
    </form>
  </aside>

  <!-- 钢厂详情弹窗 -->
  <div class="drawer-mask" id="modal-mask" hidden></div>
  <div class="modal" id="detail-modal" hidden role="dialog" aria-modal="true">
    <div class="modal-head">
      <div class="drawer-title">钢厂详情</div>
      <button id="detail-close" type="button" class="drawer-close" aria-label="关闭">✕</button>
    </div>
    <div class="modal-body" id="detail-body"></div>
  </div>

  <!-- 公共导航栏加载脚本 -->
  <script src="/common/fetch.js"></script>
  <!-- 模块脚本 -->
  <script src="steel.js"></script>
</body>
