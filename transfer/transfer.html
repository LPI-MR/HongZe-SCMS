<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>中转站点管理 - 泓泽宜通供应链管理系统</title>
  <link rel="stylesheet" href="/css/common.css" />
  <!-- 模块独立样式：仅本模块生效 -->
  <link rel="stylesheet" href="transfer.css" />
</head>
<body>
  <div class="layout">
    <!-- 左侧公共导航栏 -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-name">泓泽宜通</div>
        <div class="brand-sub">HongZe-SCMS</div>
      </div>
      <!-- 由 common/fetch.js 动态加载 common/navbar.html -->
      <div id="navbar"></div>
    </aside>

    <!-- 主内容区 -->
    <main class="main">
      <!-- 页面标题条 -->
      <div class="ledger-header">
        <div>
          <div class="page-title">中转站点管理</div>
          <div class="page-desc">铁路中转站点主数据库：公铁换装与货物集散节点，衔接矿山、港口与钢厂两端</div>
        </div>
      </div>

      <!-- 站点检索 -->
      <div class="search-card">
        <div class="search-banner">
          <span class="banner-title">站点检索</span>
        </div>

        <form class="search-form" id="searchForm">
          <div class="search-field">
            <label class="field-label" for="searchName">站点名称</label>
            <input class="field-input" type="text" id="searchName" placeholder="输入名称模糊搜索" />
          </div>

          <div class="search-field">
            <label class="field-label" for="searchLocation">所属地区</label>
            <input class="field-input" type="text" id="searchLocation" placeholder="省份 / 城市 / 区县" />
          </div>

          <div class="search-actions">
            <button class="btn btn-primary" type="submit">查询</button>
            <button class="btn btn-ghost" type="reset" id="searchReset">重置</button>
          </div>
        </form>
      </div>

      <!-- 站点列表 -->
      <div class="ledger-card">
        <div class="ledger-banner">
          <span class="banner-title">站点列表</span>
          <span class="banner-stat">共 <em id="stCount">0</em> 个站点</span>
          <button class="btn btn-ghost banner-action" id="exportBtn" type="button">导出 Excel</button>
          <button class="btn btn-primary banner-action" id="btnAddStation" type="button">新增站点</button>
        </div>

        <div class="table-wrap">
          <table class="ledger-table">
            <thead>
              <tr>
                <th class="col-index">序号</th>
                <th class="col-name">站点名称</th>
                <th class="col-line">所属线路</th>
                <th class="col-region">所属地区</th>
                <th class="col-volume">年货运量/年装卸能力</th>
                <th class="col-tracks">装卸线数量</th>
                <th class="col-action">操作</th>
              </tr>
            </thead>
            <tbody>
              <!-- 暂无数据，由 transfer.js 数据驱动渲染 -->
              <tr class="empty-row">
                <td colspan="7">暂无站点数据</td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- 分页控制 -->
        <div class="pager">
          <div class="pager-left">
            <select class="pager-size" id="pageSize">
              <option value="10" selected>10 条/页</option>
              <option value="20">20 条/页</option>
              <option value="50">50 条/页</option>
            </select>
            <span class="pager-total">共 <b id="pagerTotal">0</b> 条记录</span>
          </div>
          <div class="pager-right">
            <button type="button" class="pager-btn" id="pgFirst">首页</button>
            <button type="button" class="pager-btn" id="pgPrev">上一页</button>
            <span class="pager-info">
              第 <input class="pager-input" type="number" id="pgInput" min="1" value="1" />
              / <span id="pgPages">1</span> 页
            </span>
            <button type="button" class="pager-btn" id="pgNext">下一页</button>
            <button type="button" class="pager-btn" id="pgLast">末页</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- 编辑弹窗（详情 / 列表共用） -->
  <div class="modal-mask" id="modalMask">
    <div class="modal" id="modalBox"></div>
  </div>

  <!-- 轻提示 -->
  <div class="toast" id="toast"></div>

  <script src="/common/fetch.js"></script>
  <!-- Excel 导出组件（复用 contracts 内置 vendor） -->
  <script src="/contracts/vendor/xlsx.full.min.js"></script>
  <!-- 模块脚本 -->
  <script src="transfer.js"></script>
</body>
</html>
