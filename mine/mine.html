<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>矿山管理 - 泓泽宜通 HongZe-SCMS</title>
  <!-- 公共样式模板：全局变量 / 布局 / 导航 / 卡片，保证各模块风格统一 -->
  <link rel="stylesheet" href="/css/common.css" />
  <!-- 模块独立样式：仅本模块生效 -->
  <link rel="stylesheet" href="mine.css" />
</head>
<body>
  <div class="layout">
    <!-- 左侧公共导航栏 -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-name">泓泽宜通</div>
        <div class="brand-sub">HongZe-SCMS</div>
      </div>
      <!-- 由 common/fetch.js 动态加载 common/navbar.html -->
      <div id="navbar"></div>
    </aside>

    <!-- 主内容区：三板块结构（矿山介绍 / 基础信息 / 产品详情） -->
    <main class="main">
      <section class="ledger">
        <!-- 页面标题 -->
        <div class="ledger-header">
          <div>
            <div class="page-title">矿山管理</div>
            <div class="page-desc">矿山主数据库：货物来源的权威数据源，支撑海运与运输方案复用</div>
          </div>
        </div>

        <!-- 顶部标签栏：三板块切换（sticky 毛玻璃 + 分段控件，支持键盘方向键） -->
        <div class="tabs-bar" role="tablist" aria-label="矿山管理视图切换">
          <div class="tabs-seg" id="tabsSeg">
            <span class="seg-indicator" id="segIndicator" aria-hidden="true"></span>
            <button class="seg-btn active" type="button" role="tab" id="tabIntro" data-tab="intro" aria-selected="true" aria-controls="paneIntro">矿山介绍</button>
            <button class="seg-btn" type="button" role="tab" id="tabInfo" data-tab="info" aria-selected="false" aria-controls="paneInfo">基础信息</button>
            <button class="seg-btn" type="button" role="tab" id="tabProducts" data-tab="products" aria-selected="false" aria-controls="paneProducts">产品详情</button>
          </div>
        </div>

        <!-- ===== 板块一：矿山介绍（品牌叙事卡片，按总产量从高到低） ===== -->
        <div class="tabs-pane active" id="paneIntro" role="tabpanel" aria-labelledby="tabIntro">
          <div class="intro-grid" id="introGrid">
            <!-- 矿山叙事卡片由 mine.js 数据驱动渲染 -->
          </div>
        </div>

        <!-- ===== 板块二：基础信息（运营事实档案：工具条 + 事实卡） ===== -->
        <div class="tabs-pane" id="paneInfo" role="tabpanel" aria-labelledby="tabInfo">

          <!-- 工具条：排序说明 + 新增 / 导出 -->
          <div class="fact-toolbar">
            <span class="fact-toolbar-note">按总产量从高到低排序 · 共 <span id="factCount">0</span> 座矿山</span>
            <div class="fact-toolbar-actions">
              <button class="btn btn-ghost" id="exportBtn" type="button">导出 Excel</button>
              <button class="btn btn-primary" id="addMineBtn" type="button">新增矿山</button>
            </div>
          </div>

          <!-- 矿山事实卡（每矿一张，按总产量降序，由 mine.js 渲染） -->
          <div class="fact-list" id="factList"></div>
        </div>

        <!-- ===== 板块三：产品详情（矿山切换 + 折叠分组 + 参数弹层） ===== -->
        <div class="tabs-pane" id="paneProducts" role="tabpanel" aria-labelledby="tabProducts">

          <!-- 矿山切换标签（固定主视觉，由 mine.js 渲染，选中态高亮） -->
          <div class="mine-chips" id="mineChips" aria-label="按矿山筛选产品矩阵"></div>

          <!-- 单矿聚焦的产品矩阵（独立滚动区，产品卡可点击查看参数） -->
          <div id="productGroups"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- 矿山介绍 · 沉浸式详情弹层（顶部 Hero 卫星影像 + 视差 + 纯叙事正文） -->
  <div class="intro-modal-mask" id="introModalMask" hidden role="dialog" aria-modal="true" aria-labelledby="imTitle">
    <article class="intro-modal">
      <button class="intro-modal-close" id="introModalClose" type="button" aria-label="关闭">&times;</button>

      <!-- 顶部 Hero：全宽真实卫星 / 高空位置影像 -->
      <div class="intro-hero">
        <img id="imHeroImg" alt="" decoding="async" />
        <!-- Apple 式渐进虚化：同源模糊副本，mask 自上而下淡入（顶部清晰 → 底部融化） -->
        <img id="imHeroBlur" class="hero-blur" alt="" aria-hidden="true" decoding="async" />
        <div class="intro-hero-shade" aria-hidden="true"></div>
        <div class="intro-hero-caption">
          <h2 id="imTitle"></h2>
          <p id="imTagline"></p>
        </div>
      </div>

      <!-- 正文：纯文章 + 图片（无任何结构化数据） -->
      <div class="intro-body" id="introBody"></div>
    </article>
  </div>

  <!-- 产品详情 · 参数弹层（居中浮层：品位大字 + 参数网格 + 专业描述，内容由 mine.js 渲染） -->
  <div class="prod-modal-mask" id="prodModalMask" hidden role="dialog" aria-modal="true" aria-labelledby="pmTitle">
    <div class="prod-modal">
      <button class="prod-modal-close" id="prodModalClose" type="button" aria-label="关闭">&times;</button>
      <div class="prod-modal-body" id="prodModalBody"></div>
    </div>
  </div>

  <!-- 新增 / 编辑矿山抽屉（基础信息 / 矿区位置 两组；产品与产能字段归产品详情板块维护） -->
  <div class="drawer-mask" id="editorMask" hidden>
    <aside class="drawer">
      <div class="drawer-header">
        <span class="drawer-title" id="editorTitle">新增矿山</span>
        <button class="drawer-close" id="editorClose" type="button" aria-label="关闭">&times;</button>
      </div>

      <div class="drawer-body">
        <!-- 分组一：基础信息 -->
        <div class="drawer-section">
          <div class="section-title">基础信息</div>
          <div class="form-grid">
            <div class="form-item">
              <label class="field-label" for="fMineName">矿山名称 <i class="required">*</i></label>
              <input class="field-input" type="text" id="fMineName" placeholder="如：卡拉加斯铁矿" />
            </div>
            <div class="form-item">
              <label class="field-label" for="fShortName">矿山简称</label>
              <input class="field-input" type="text" id="fShortName" placeholder="列表展示用，如：力拓" />
            </div>
            <div class="form-item">
              <label class="field-label" for="fMineType">矿山类型 <i class="required">*</i></label>
              <select class="field-input" id="fMineType">
                <option value="iron">铁矿</option>
                <option value="coal">煤矿</option>
                <option value="nonferrous">有色金属矿</option>
                <option value="nonmetal">非金属矿</option>
                <option value="other">其他</option>
              </select>
            </div>
            <div class="form-item">
              <label class="field-label" for="fOperator">运营主体</label>
              <input class="field-input" type="text" id="fOperator" placeholder="矿山实际运营公司名称" />
            </div>
            <div class="form-item">
              <label class="field-label" for="fContactPerson">联系人</label>
              <input class="field-input" type="text" id="fContactPerson" placeholder="矿山对接人" />
            </div>
            <div class="form-item">
              <label class="field-label" for="fContactPhone">联系电话</label>
              <input class="field-input" type="text" id="fContactPhone" placeholder="矿山对接电话" />
            </div>
            <div class="form-item">
              <label class="field-label" for="fCommissionedYear">投产年份</label>
              <input class="field-input" type="number" min="1900" max="2035" id="fCommissionedYear" placeholder="如：2013" />
            </div>
            <div class="form-item">
              <label class="field-label" for="fStatus">状态</label>
              <select class="field-input" id="fStatus">
                <option value="active">在用</option>
                <option value="inactive">停用</option>
              </select>
            </div>
          </div>
          <div class="form-item">
            <label class="field-label" for="fRemark">备注</label>
            <textarea class="field-input remark-input" id="fRemark" rows="3" placeholder="其他说明信息"></textarea>
          </div>
        </div>

        <!-- 分组二：矿区位置（专业命名：州省/国别 · 矿区区域 · 详细位置 · 坐标） -->
        <div class="drawer-section">
          <div class="section-title">矿区位置</div>
          <div class="form-grid">
            <div class="form-item">
              <label class="field-label" for="fProvince">州省 / 国别 <i class="required">*</i></label>
              <input class="field-input" type="text" id="fProvince" placeholder="如：西澳大利亚州 / 几内亚" />
            </div>
            <div class="form-item">
              <label class="field-label" for="fCity">矿区区域 <i class="required">*</i></label>
              <input class="field-input" type="text" id="fCity" placeholder="如：皮尔巴拉地区" />
            </div>
            <div class="form-item">
              <label class="field-label" for="fAddress">详细位置</label>
              <input class="field-input" type="text" id="fAddress" placeholder="矿区具体位置描述" />
            </div>
            <div class="form-item">
              <label class="field-label" for="fLongitude">经度（WGS84）</label>
              <input class="field-input" type="number" step="0.000001" min="-180" max="180" id="fLongitude" placeholder="-180 ~ 180" />
            </div>
            <div class="form-item">
              <label class="field-label" for="fLatitude">纬度（WGS84）</label>
              <input class="field-input" type="number" step="0.000001" min="-90" max="90" id="fLatitude" placeholder="-90 ~ 90" />
            </div>
          </div>
        </div>

        <!-- 表单错误提示 -->
        <div class="form-tip" id="formTip" hidden></div>

        <div class="drawer-actions">
          <button class="btn btn-primary" id="editorSave" type="button">保存</button>
          <button class="btn btn-ghost" id="editorCancel" type="button">取消</button>
        </div>
      </div>
    </aside>
  </div>

  <!-- 导出 Excel 依赖库（复用 contracts 模块本地离线 SheetJS，不重复引入） -->
  <script src="/contracts/vendor/xlsx.full.min.js"></script>

  <!-- 公共导航栏加载脚本 -->
  <script src="/common/fetch.js"></script>
  <!-- 模块脚本 -->
  <script src="mine.js"></script>
</body>
</html>
