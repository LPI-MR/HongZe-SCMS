<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>矿山管理 - 泓泽宜通 HongZe-SCMS</title>
  <!-- 公共样式模板：全局变量 / 布局 / 导航 / 卡片，保证各模块风格统一 -->
  <link rel="stylesheet" href="/css/common.css" />
  <!-- 模块独立样式：仅本模块生效 -->
  <link rel="stylesheet" href="mine.css" />
</head>
<body>
  <div class="layout">
    <!-- 左侧公共导航栏 -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-name">泓泽宜通</div>
        <div class="brand-sub">HongZe-SCMS</div>
      </div>
      <!-- 由 common/fetch.js 动态加载 common/navbar.html -->
      <div id="navbar"></div>
    </aside>

    <!-- 主内容区：本模块独立设计 -->
    <main class="main">
      <section class="ledger">
        <!-- 页面标题 + 模块级入口 -->
        <div class="ledger-header">
          <div>
            <div class="page-title">矿山管理</div>
            <div class="page-desc">矿山主数据库：货物来源的权威数据源，支撑海运与运输方案复用</div>
          </div>
          <div>
            <button class="btn btn-ghost banner-action" id="mineDashBtn" type="button">数据看板</button>
          </div>
        </div>

        <!-- 台账统计卡（实时汇总全部矿山数据） -->
        <div class="ledger-kpis">
          <div class="stat-card">
            <div class="stat-label">矿山总数</div>
            <div class="stat-value" id="tTotal">0</div>
            <div class="stat-note">全部登记矿山</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">在用矿山</div>
            <div class="stat-value" id="tActive">0</div>
            <div class="stat-note">状态为在用</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">覆盖省份数</div>
            <div class="stat-value" id="tProvinces">0</div>
            <div class="stat-note">所在地省份去重</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">主流产品种类</div>
            <div class="stat-value" id="tProducts">0</div>
            <div class="stat-note">产品品类去重数</div>
          </div>
        </div>

        <!-- 矿山检索 -->
        <div class="search-card">
          <!-- 检索小标题 -->
          <div class="search-banner">
            <span class="banner-title">矿山检索</span>
          </div>

          <!-- 检索表单 -->
          <form class="search-form" id="searchForm">
            <div class="search-field">
              <label class="field-label" for="searchName">矿山名称</label>
              <input class="field-input" type="text" id="searchName" placeholder="输入名称模糊搜索" />
            </div>

            <div class="search-field">
              <label class="field-label" for="searchLocation">所在地</label>
              <input class="field-input" type="text" id="searchLocation" placeholder="省份 / 城市 / 区县" />
            </div>

            <div class="search-field">
              <label class="field-label" for="searchProduct">主流产品</label>
              <select class="field-input" id="searchProduct">
                <option value="">全部</option>
                <!-- 选项由 mine.js 依据现有矿山产品聚合生成 -->
              </select>
            </div>

            <div class="search-field">
              <label class="field-label" for="searchStatus">状态</label>
              <select class="field-input" id="searchStatus">
                <option value="">全部</option>
                <option value="active">在用</option>
                <option value="inactive">停用</option>
              </select>
            </div>

            <div class="search-actions">
              <button class="btn btn-primary" type="submit">查询</button>
              <button class="btn btn-ghost" type="reset" id="searchReset">重置</button>
            </div>
          </form>
        </div>

        <!-- 矿山列表 -->
        <div class="ledger-card">
          <!-- 列表小标题 -->
          <div class="ledger-banner">
            <span class="banner-title">矿山列表</span>
            <span class="banner-stat">共 <em id="mineCount">0</em> 座，总产能 <em id="mineCapacity">0</em> 万吨/年</span>
            <button class="btn btn-ghost banner-action" id="exportBtn" type="button">导出 Excel</button>
            <button class="btn btn-primary banner-action" id="addMineBtn" type="button">新增矿山</button>
          </div>

          <div class="table-wrap">
            <table class="ledger-table">
              <thead>
                <tr>
                  <th class="col-index">序号</th>
                  <th class="col-code">矿山编号</th>
                  <th class="col-sortable" data-sort="mine_name">矿山名称<span class="sort-arrow" id="sortName"></span></th>
                  <th class="col-products">主流产品</th>
                  <th>所在地</th>
                  <th class="col-num col-sortable" data-sort="annual_capacity">产能(万吨/年)<span class="sort-arrow" id="sortCapacity"></span></th>
                  <th>状态</th>
                  <th class="col-date">创建时间</th>
                  <th class="col-action">操作</th>
                </tr>
              </thead>
              <tbody>
                <!-- 暂无数据，由 mine.js 数据驱动渲染 -->
                <tr class="empty-row">
                  <td colspan="9">暂无矿山数据</td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- 分页控制 -->
          <div class="pager">
            <div class="pager-left">
              <select class="pager-size" id="pageSize">
                <option value="10" selected>10 条/页</option>
                <option value="20">20 条/页</option>
                <option value="50">50 条/页</option>
              </select>
              <span class="pager-total">共 <b id="pagerTotal">0</b> 条记录</span>
            </div>
            <div class="pager-right">
              <button type="button" class="pager-btn" id="pgFirst">首页</button>
              <button type="button" class="pager-btn" id="pgPrev">上一页</button>
              <span class="pager-info">
                第 <input class="pager-input" type="number" id="pgInput" min="1" value="1" />
                / <span id="pgPages">1</span> 页
              </span>
              <button type="button" class="pager-btn" id="pgNext">下一页</button>
              <button type="button" class="pager-btn" id="pgLast">末页</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- 新增 / 编辑矿山抽屉（基础信息 / 地理位置 / 产品与产能 三分组） -->
  <div class="drawer-mask" id="editorMask" hidden>
    <aside class="drawer">
      <div class="drawer-header">
        <span class="drawer-title" id="editorTitle">新增矿山</span>
        <button class="drawer-close" id="editorClose" type="button" aria-label="关闭">&times;</button>
      </div>

      <div class="drawer-body">
        <!-- 分组一：基础信息 -->
        <div class="drawer-section">
          <div class="section-title">基础信息</div>
          <div class="form-grid">
            <div class="form-item">
              <label class="field-label" for="fMineName">矿山名称 <i class="required">*</i></label>
              <input class="field-input" type="text" id="fMineName" placeholder="如：卡拉加斯铁矿" />
            </div>
            <div class="form-item">
              <label class="field-label" for="fShortName">矿山简称</label>
              <input class="field-input" type="text" id="fShortName" placeholder="列表展示用，如：力拓" />
            </div>
            <div class="form-item">
              <label class="field-label" for="fMineType">矿山类型 <i class="required">*</i></label>
              <select class="field-input" id="fMineType">
                <option value="iron">铁矿</option>
                <option value="coal">煤矿</option>
                <option value="nonferrous">有色金属矿</option>
                <option value="nonmetal">非金属矿</option>
                <option value="other">其他</option>
              </select>
            </div>
            <div class="form-item">
              <label class="field-label" for="fOperator">开采/运营主体</label>
              <input class="field-input" type="text" id="fOperator" placeholder="矿山实际运营公司名称" />
            </div>
            <div class="form-item">
              <label class="field-label" for="fContactPerson">联系人</label>
              <input class="field-input" type="text" id="fContactPerson" placeholder="矿山对接人" />
            </div>
            <div class="form-item">
              <label class="field-label" for="fContactPhone">联系电话</label>
              <input class="field-input" type="text" id="fContactPhone" placeholder="矿山对接电话" />
            </div>
          </div>
        </div>

        <!-- 分组二：地理位置 -->
        <div class="drawer-section">
          <div class="section-title">地理位置</div>
          <div class="form-grid">
            <div class="form-item">
              <label class="field-label" for="fProvince">所在省份 <i class="required">*</i></label>
              <input class="field-input" type="text" id="fProvince" placeholder="如：西澳大利亚州" />
            </div>
            <div class="form-item">
              <label class="field-label" for="fCity">所在城市 <i class="required">*</i></label>
              <input class="field-input" type="text" id="fCity" placeholder="如：皮尔巴拉地区" />
            </div>
            <div class="form-item">
              <label class="field-label" for="fDistrict">所在区县</label>
              <input class="field-input" type="text" id="fDistrict" placeholder="可空" />
            </div>
            <div class="form-item">
              <label class="field-label" for="fAddress">详细地址</label>
              <input class="field-input" type="text" id="fAddress" placeholder="具体位置描述" />
            </div>
            <div class="form-item">
              <label class="field-label" for="fLongitude">经度（WGS84）</label>
              <input class="field-input" type="number" step="0.000001" min="-180" max="180" id="fLongitude" placeholder="-180 ~ 180" />
            </div>
            <div class="form-item">
              <label class="field-label" for="fLatitude">纬度（WGS84）</label>
              <input class="field-input" type="number" step="0.000001" min="-90" max="90" id="fLatitude" placeholder="-90 ~ 90" />
            </div>
          </div>
        </div>

        <!-- 分组三：产品与产能 -->
        <div class="drawer-section">
          <div class="section-title">产品与产能</div>
          <div class="form-item">
            <label class="field-label">主流产品 <i class="required">*</i></label>
            <!-- 快捷标签多选 + 自定义输入（Q-MINE-02：从品类字典多选，允许补充） -->
            <div class="product-pills" id="productPills"></div>
            <div class="product-custom">
              <input class="field-input" type="text" id="fProductCustom" placeholder="自定义产品，回车添加" />
            </div>
            <div class="product-selected" id="productSelected"></div>
          </div>
          <div class="form-grid">
            <div class="form-item">
              <label class="field-label" for="fAnnualCapacity">年产能（万吨/年）</label>
              <input class="field-input" type="number" min="0" step="0.01" id="fAnnualCapacity" placeholder="0.00" />
            </div>
            <div class="form-item">
              <label class="field-label" for="fReserve">保有储量（万吨）</label>
              <input class="field-input" type="number" min="0" step="0.01" id="fReserve" placeholder="0.00" />
            </div>
            <div class="form-item">
              <label class="field-label" for="fOreGrade">品位 / 品位范围</label>
              <input class="field-input" type="text" id="fOreGrade" placeholder="如：TFe 55%-65%" />
            </div>
            <div class="form-item">
              <label class="field-label" for="fStatus">状态</label>
              <select class="field-input" id="fStatus">
                <option value="active">在用</option>
                <option value="inactive">停用</option>
              </select>
            </div>
          </div>
          <div class="form-item">
            <label class="field-label" for="fRemark">备注</label>
            <textarea class="field-input remark-input" id="fRemark" rows="3" placeholder="其他说明信息（图片上传功能 P2 再议，本期预留文本）"></textarea>
          </div>
        </div>

        <!-- 表单错误提示 -->
        <div class="form-tip" id="formTip" hidden></div>

        <div class="drawer-actions">
          <button class="btn btn-primary" id="editorSave" type="button">保存</button>
          <button class="btn btn-ghost" id="editorCancel" type="button">取消</button>
        </div>
      </div>
    </aside>
  </div>

  <!-- 导出 Excel 依赖库（复用 contracts 模块本地离线 SheetJS，不重复引入） -->
  <script src="/contracts/vendor/xlsx.full.min.js"></script>

  <!-- 公共导航栏加载脚本 -->
  <script src="/common/fetch.js"></script>
  <!-- 模块脚本 -->
  <script src="mine.js"></script>
</body>
</html>
