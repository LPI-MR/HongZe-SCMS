# 本地开发数据库(按《分布式开发数据库协作方案》)
# 启动: docker compose up -d
services:
  db:
    image: postgres:16
    container_name: hongze-scms-db
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: hongze_scms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
