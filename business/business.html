<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>业务总览 - 泓泽宜通 HongZe-SCMS</title>
  <!-- 公共样式模板：全局变量 / 布局 / 导航 / 按钮与输入组件 -->
  <link rel="stylesheet" href="/css/common.css" />
  <!-- 业务流程模块样式：工作台 / 录入表单 / 步骤条 / 详情组件 -->
  <link rel="stylesheet" href="flow/flow.css" />
</head>
<body class="page-workbench page-overview lock-view">
  <div class="layout">
    <!-- 左侧公共导航栏 -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-name">泓泽宜通</div>
        <div class="brand-sub">HongZe-SCMS</div>
      </div>
      <!-- 由 common/fetch.js 动态加载 common/navbar.html -->
      <div id="navbar"></div>
    </aside>

    <!-- 主内容区：业务流程快捷操作枢纽（无列表，直达核心执行） -->
    <main class="main">
      <!-- 扁平页头：标题 + 主操作 -->
      <header class="wb-header">
        <div>
          <h1 class="wb-title">业务总览</h1>
          <p class="wb-desc">从订单录入到运输方案，一站式推进履约全流程</p>
        </div>
        <a class="btn-primary" href="flow/order-form.html">＋ 新建订单</a>
      </header>

      <!-- 内容滚动区：页头固定，仅此区域上下滚动（R2 视口锁定规范） -->
      <div class="main-scroll">
      <!-- 概览摘要：纯排版数字条（非卡片） -->
      <section class="ov-summary" id="ov-summary" aria-label="业务概览"></section>

      <!-- 业务流程快捷入口：五步直达对应环节 -->
      <section class="ov-section">
        <div class="ov-section-head">
          <h2 class="ov-section-title">业务流程</h2>
          <span class="ov-section-sub">按步骤推进，直达待办环节</span>
        </div>
        <div class="ov-steps" id="ov-steps"></div>
      </section>

      <!-- 继续办理：进行中订单下一步直达 -->
      <section class="ov-section">
        <div class="ov-section-head">
          <h2 class="ov-section-title">继续办理</h2>
          <a class="ov-more" href="orders.html?view=flow">查看全部订单 ›</a>
        </div>
        <div class="ov-resume" id="ov-resume"></div>
      </section>
      </div><!-- /.main-scroll -->
    </main>
  </div>

  <!-- 全局提示 -->
  <div class="toast" id="toast"></div>

  <!-- 公共导航栏加载脚本 -->
  <script src="/common/fetch.js"></script>
  <!-- 业务流程共享数据层 -->
  <script src="flow/flow-data.js"></script>
  <!-- 业务总览快捷枢纽脚本 -->
  <script src="flow/overview.js"></script>
</body>
</html>
