<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>订单台账 - 泓泽宜通 HongZe-SCMS</title>
  <!-- 公共样式模板：全局变量 / 布局 / 导航 / 卡片，保证各模块风格统一 -->
  <link rel="stylesheet" href="/css/common.css" />
  <!-- 业务板块独立样式：订单台账 / 执行跟踪 / 结算管理共用 -->
  <link rel="stylesheet" href="business.css" />
</head>
<body class="page-orders">
  <div class="layout">
    <!-- 左侧公共导航栏 -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-name">泓泽宜通</div>
        <div class="brand-sub">HongZe-SCMS</div>
      </div>
      <!-- 由 common/fetch.js 动态加载 common/navbar.html -->
      <div id="navbar"></div>
    </aside>

    <!-- 主内容区：本模块独立设计 -->
    <main class="main">
      <!-- 订单台账 -->
      <section class="ledger">
        <!-- 页面标题 + 页头动作 -->
        <div class="ledger-header">
          <div>
            <div class="page-title">订单台账</div>
            <div class="page-desc">登记与管理全部业务订单，跟踪履约状态</div>
          </div>
          <div class="header-actions">
            <button class="btn btn-ghost" id="exportBtn" type="button">导出 Excel</button>
            <button class="btn btn-primary" id="addOrderBtn" type="button">新增订单</button>
          </div>
        </div>

        <!-- 视图切换：业务订单（台账原视图）| 履约流程（承接自业务总览的订单列表板块） -->
        <div class="view-switch" id="viewSwitch">
          <button class="seg-btn active" type="button" data-view="biz">业务订单</button>
          <button class="seg-btn" type="button" data-view="flow">履约流程</button>
        </div>

        <!-- 视图一：业务订单（原有台账内容，逻辑不变） -->
        <div id="view-biz">
        <!-- 概览条：主指标（订单总额）+ 派生指标 + 履约完成率（实时汇总全部订单数据） -->
        <div class="biz-overview">
          <div class="ov-primary">
            <div class="ov-label">订单总额</div>
            <div class="ov-value" id="tAmount">¥0</div>
            <div class="ov-note">全部订单金额合计</div>
          </div>
          <div class="ov-divider"></div>
          <div class="ov-metrics">
            <div class="ov-metric">
              <div class="ov-label">订单总数</div>
              <div class="ov-num" id="tTotal">0</div>
              <div class="ov-note">含已终止</div>
            </div>
            <div class="ov-metric">
              <div class="ov-label">履行中</div>
              <div class="ov-num" id="tRunning">0</div>
              <div class="ov-note">执行中 / 已发运</div>
            </div>
            <div class="ov-metric">
              <div class="ov-label">已完成</div>
              <div class="ov-num" id="tDone">0</div>
              <div class="ov-note">全流程完成</div>
            </div>
          </div>
          <div class="ov-divider"></div>
          <div class="ov-rate">
            <div class="ov-label">履约完成率</div>
            <div class="ov-rate-bar"><i id="ovDoneBar"></i></div>
            <div class="ov-note">已完成 <b id="ovDoneRate">0%</b> / 全部订单</div>
          </div>
        </div>

        <!-- 流程胶囊导航：按履约状态一键过滤（全部 + 6 个状态） -->
        <div class="pill-nav" id="flowNav">
          <button class="pill active" type="button" data-flow="">
            <span class="flow-dot"></span>全部
            <span class="flow-count">0</span>
          </button>
          <button class="pill" type="button" data-flow="待确认">
            <span class="flow-dot d-pending"></span>待确认
            <span class="flow-count">0</span>
          </button>
          <button class="pill" type="button" data-flow="已确认">
            <span class="flow-dot d-confirmed"></span>已确认
            <span class="flow-count">0</span>
          </button>
          <button class="pill" type="button" data-flow="执行中">
            <span class="flow-dot d-running"></span>执行中
            <span class="flow-count">0</span>
          </button>
          <button class="pill" type="button" data-flow="已发运">
            <span class="flow-dot d-shipped"></span>已发运
            <span class="flow-count">0</span>
          </button>
          <button class="pill" type="button" data-flow="已完成">
            <span class="flow-dot d-done"></span>已完成
            <span class="flow-count">0</span>
          </button>
          <button class="pill" type="button" data-flow="已终止">
            <span class="flow-dot d-terminated"></span>已终止
            <span class="flow-count">0</span>
          </button>
        </div>

        <!-- 台账列表 -->
        <div class="ledger-card">
          <!-- 列表小标题 -->
          <div class="ledger-banner">
            <span class="banner-title">订单列表</span>
            <span class="banner-stat">共 <em id="orderCount">0</em> 单，合计 <em id="orderAmount">0.00</em> 元</span>
          </div>

          <!-- 轻检索工具条：关键词 / 签订日期区间，输入即筛 -->
          <form class="table-toolbar" id="searchForm" autocomplete="off">
            <input class="field-input toolbar-input" type="text" id="searchKeyword" placeholder="搜索订单编号 / 客户 / 货物 / 矿山，空格分隔多个关键词" />
            <div class="field-date-range">
              <input class="field-input" type="date" id="searchDateStart" title="签订日期起" />
              <span class="date-sep">至</span>
              <input class="field-input" type="date" id="searchDateEnd" title="签订日期止" />
            </div>
            <div class="toolbar-actions">
              <button class="btn btn-ghost" type="reset" id="searchReset">重置</button>
            </div>
          </form>

          <div class="table-wrap">
            <table class="ledger-table min-w-orders">
              <thead>
                <tr>
                  <th class="col-check"><input type="checkbox" id="checkAll" title="全选" /></th>
                  <th class="col-index">序号</th>
                  <th>订单编号</th>
                  <th>合同编号</th>
                  <th>客户</th>
                  <th>货物</th>
                  <th class="col-num">货量（万吨）</th>
                  <th class="col-num">订单金额（元）</th>
                  <th>矿山</th>
                  <th>关联航次</th>
                  <th>状态</th>
                  <th class="col-date">签订日期</th>
                  <th class="col-detail">详情</th>
                  <th class="col-action">操作</th>
                </tr>
              </thead>
              <tbody>
                <!-- 暂无数据，待后续接入 -->
                <tr class="empty-row">
                  <td colspan="14">暂无订单数据</td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- 分页控制 -->
          <div class="pager">
            <div class="pager-left">
              <select class="pager-size" id="pageSize">
                <option value="10" selected>10 条/页</option>
                <option value="20">20 条/页</option>
                <option value="50">50 条/页</option>
              </select>
              <span class="pager-total">共 <b id="pagerTotal">0</b> 条记录</span>
            </div>
            <div class="pager-right">
              <button type="button" class="pager-btn" id="pgFirst">首页</button>
              <button type="button" class="pager-btn" id="pgPrev">上一页</button>
              <span class="pager-info">
                第 <input class="pager-input" type="number" id="pgInput" min="1" value="1" />
                / <span id="pgPages">1</span> 页
              </span>
              <button type="button" class="pager-btn" id="pgNext">下一页</button>
              <button type="button" class="pager-btn" id="pgLast">末页</button>
            </div>
          </div>
        </div>
        </div><!-- /#view-biz -->

        <!-- 视图二：履约流程（迁移自业务总览：检索 / 状态筛选 / 排序 / 详情直达 / 删除） -->
        <div id="view-flow" hidden>
          <!-- 数字摘要条：纯排版，无卡片 -->
          <div class="fv-stats" id="fvStats"></div>

          <div class="ledger-card">
            <div class="ledger-banner">
              <span class="banner-title">履约流程订单</span>
              <span class="banner-stat" id="fvSub">共 0 个订单</span>
            </div>

            <!-- 工具条：关键词检索 + 阶段筛选 + 排序 -->
            <div class="fv-toolbar">
              <div class="fv-search">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
                <input type="text" id="fvSearch" placeholder="搜索订单编号 / 客户 / 货物 / 到港" autocomplete="off" />
              </div>
              <div class="seg" id="fvFilterSeg"></div>
              <div class="sort-group" id="fvSortGroup"></div>
            </div>

            <div class="table-wrap">
              <table class="ledger-table fv-table">
                <thead>
                  <tr>
                    <th>订单编号</th>
                    <th>客户</th>
                    <th>货物</th>
                    <th class="col-num">货量（吨）</th>
                    <th>到港</th>
                    <th>通道</th>
                    <th>状态</th>
                    <th class="col-date">创建时间</th>
                    <th class="col-action">操作</th>
                  </tr>
                </thead>
                <tbody id="fvBody">
                  <tr class="empty-row">
                    <td colspan="9">暂无订单</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- 删除操作反馈（毛玻璃 toast） -->
          <div class="toast" id="fvToast"></div>
        </div><!-- /#view-flow -->
      </section>
    </main>
  </div>

  <!-- 订单详情 / 新增 / 编辑 / 流转抽屉（内容动态渲染） -->
  <div class="drawer-mask" id="drawerMask" hidden>
    <aside class="drawer">
      <div class="drawer-header">
        <span class="drawer-title" id="drawerTitle">订单详情</span>
        <button class="drawer-close" id="drawerClose" type="button" aria-label="关闭">&times;</button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
    </aside>
  </div>

  <!-- 导出 Excel 依赖库（本地离线） -->
  <script src="/contracts/vendor/xlsx.full.min.js"></script>

  <!-- 公共导航栏加载脚本 -->
  <script src="/common/fetch.js"></script>
  <!-- 模块化数据基座：跨模块字段（合同 / 矿山 / 航次等）统一经 HZData 调取各模块权威数据源 -->
  <script src="/common/hz-data.js"></script>
  <!-- 业务共享数据层：订单 / 结算 / 流转日志读写 -->
  <script src="business-data.js"></script>
  <!-- 履约流程数据层：业务总览 / 订单流转子页共用（hz_flow_* 键空间） -->
  <script src="flow/flow-data.js"></script>
  <!-- 模块脚本 -->
  <script src="orders.js"></script>
  <!-- 履约流程视图脚本（迁移自业务总览 workbench） -->
  <script src="orders-flow.js"></script>
</body>
</html>
