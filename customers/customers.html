<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>客户管理 - 泓泽宜通 HongZe-SCMS</title>
  <!-- 公共样式模板：全局变量 / 布局 / 导航 / 组件层 -->
  <link rel="stylesheet" href="/css/common.css" />
  <!-- 客户管理模块样式：统一库 / 同步控制台共用 -->
  <link rel="stylesheet" href="customers.css" />
  <style>
    /* 本页专属：表格列宽与名称列样式 */
    .min-w-cust { min-width: 1080px; }
    .col-code { width: 190px; font-variant-numeric: tabular-nums; }
    .col-roles { width: 220px; }
    .col-industry { width: 150px; }
    .col-source { width: 240px; }
    .col-op { width: 90px; text-align: center; }
    .cust-name { font-weight: 500; color: #1d1d1f; cursor: pointer; transition: color 0.18s cubic-bezier(0.25, 0.1, 0.25, 1); }
    .cust-name:hover { color: #0071e3; }
    .cust-alias { font-size: 12px; color: #86868b; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="layout">
    <!-- 左侧公共导航栏 -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-name">泓泽宜通</div>
        <div class="brand-sub">HongZe-SCMS</div>
      </div>
      <!-- 由 common/fetch.js 动态加载 common/navbar.html -->
      <div id="navbar"></div>
    </aside>

    <!-- 主内容区 -->
    <main class="main">
      <section class="ledger">
        <!-- 页头 -->
        <div class="ledger-header">
          <div>
            <div class="page-title">客户管理</div>
            <div class="page-desc">客户管理统一库：汇聚六大业务模块的企业主体，自动打标 / 来源可溯 / 双视图检索</div>
          </div>
          <div class="header-actions">
            <a class="btn btn-ghost" href="/customers/sync.html">同步控制台</a>
            <button class="btn btn-primary" id="btnRefresh" type="button">刷新数据</button>
          </div>
        </div>

        <!-- 统一库概览：单行纯信息指标（无容器无边框，最小垂直占用） -->
        <div class="kpi-line" role="group" aria-label="统一库概览">
          <div class="kp">
            <span class="kp-label">统一主体总数</span>
            <b class="kp-value" id="kpiTotal">0</b>
            <span class="kp-note" id="kpiTotalNote">—</span>
          </div>
          <div class="kp">
            <span class="kp-label">客户视图主体</span>
            <b class="kp-value" id="kpiCust">0</b>
            <span class="kp-note">钢铁企业 <b id="kpiSteel">0</b> · 矿石贸易商 <b id="kpiTrader">0</b></span>
          </div>
          <div class="kp">
            <span class="kp-label">供应商视图主体</span>
            <b class="kp-value" id="kpiRes">0</b>
            <span class="kp-note">物流 / 场站 / 仓储服务商</span>
          </div>
          <div class="kp">
            <span class="kp-label">统一社会信用代码覆盖</span>
            <b class="kp-value" id="kpiCode">0</b>
            <span class="kp-note">空值待人工补录</span>
          </div>
        </div>

        <!-- 视图切换 + 客户类型细分（类型控件仅客户视图内可见） -->
        <div class="tabs-row">
          <div class="view-tabs" id="viewTabs">
            <button class="view-tab active" type="button" data-view="all">全部主体 <span class="tab-badge" id="badgeAll">0</span></button>
            <button class="view-tab" type="button" data-view="customer">客户视图 <span class="tab-badge" id="badgeCust">0</span></button>
            <button class="view-tab" type="button" data-view="resource">供应商视图 <span class="tab-badge" id="badgeRes">0</span></button>
          </div>
          <div class="view-tabs type-tabs" id="typeTabs" hidden>
            <button class="view-tab active" type="button" data-type="all">全部类型 <span class="tab-badge" id="typeBadgeAll">0</span></button>
            <button class="view-tab" type="button" data-type="steel">钢铁企业 <span class="tab-badge" id="typeBadgeSteel">0</span></button>
            <button class="view-tab" type="button" data-type="trader">矿石贸易商 <span class="tab-badge" id="typeBadgeTrader">0</span></button>
          </div>
        </div>

        <!-- 台账列表 -->
        <div class="ledger-card">
          <div class="ledger-banner">
            <span class="banner-title">客户主体列表</span>
            <span class="banner-stat">共 <em id="custCount">0</em> 家主体，当前筛选命中 <em id="custHit">0</em> 家</span>
          </div>

          <!-- 筛选工具条：关键词 / 行业标签（多选）/ 数据来源 -->
          <div class="filter-bar">
            <input class="field-input" type="text" id="searchKeyword" placeholder="搜索企业名称 / 简称 / 信用代码，空格分隔多关键词" />
            <div class="chip-row" id="industryChips"></div>
            <span class="filter-label">数据来源</span>
            <select class="filter-select" id="sourceSelect">
              <option value="">全部来源</option>
            </select>
            <button class="btn btn-ghost btn-sm" id="btnReset" type="button">重置筛选</button>
          </div>

          <div class="table-wrap">
            <table class="ledger-table min-w-cust">
              <thead>
                <tr>
                  <th class="col-index">序号</th>
                  <th>企业名称</th>
                  <th class="col-code">统一社会信用代码</th>
                  <th class="col-roles">业务角色</th>
                  <th class="col-industry">行业标签</th>
                  <th class="col-source">数据来源</th>
                  <th class="col-op">操作</th>
                </tr>
              </thead>
              <tbody id="custTbody">
                <tr class="empty-row"><td colspan="7">加载中…</td></tr>
              </tbody>
            </table>
          </div>

          <!-- 分页控制 -->
          <div class="pager">
            <div class="pager-left">
              <select class="pager-size" id="pageSize">
                <option value="10" selected>10 条/页</option>
                <option value="20">20 条/页</option>
                <option value="50">50 条/页</option>
              </select>
              <span class="pager-total">共 <b id="pagerTotal">0</b> 条记录</span>
            </div>
            <div class="pager-right">
              <button type="button" class="pager-btn" id="pgFirst">首页</button>
              <button type="button" class="pager-btn" id="pgPrev">上一页</button>
              <span class="pager-info">
                第 <input class="pager-input" type="number" id="pgInput" min="1" value="1" />
                / <span id="pgPages">1</span> 页
              </span>
              <button type="button" class="pager-btn" id="pgNext">下一页</button>
              <button type="button" class="pager-btn" id="pgLast">末页</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- 主体详情抽屉（内容动态渲染） -->
  <div class="drawer-mask" id="drawerMask" hidden>
    <aside class="drawer">
      <div class="drawer-header">
        <span class="drawer-title" id="drawerTitle">主体详情</span>
        <button class="drawer-close" id="drawerClose" type="button" aria-label="关闭">&times;</button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
    </aside>
  </div>

  <!-- 轻提示 -->
  <div class="toast" id="toast"></div>

  <!-- 公共导航栏加载脚本 -->
  <script src="/common/fetch.js"></script>
  <!-- 同步引擎：复用其统一库只读接口（readUnified / 标签常量），不在本页启动同步 -->
  <script src="sync-engine.js"></script>
  <!-- 模块脚本 -->
  <script src="customers.js"></script>
</body>
</html>
