<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>仓储管理 - 泓泽宜通 HongZe-SCMS</title>
  <!-- 公共样式模板：全局变量 / 布局 / 导航 / 卡片，保证各模块风格统一 -->
  <link rel="stylesheet" href="/css/common.css" />
  <!-- 模块独立样式：仅本模块生效 -->
  <link rel="stylesheet" href="warehouse.css?v=20261029k" />
</head>
<body data-portal="warehouse">
  <div class="layout">
    <!-- 左侧公共导航栏 -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-name">泓泽宜通</div>
        <div class="brand-sub">HongZe-SCMS</div>
      </div>
      <!-- 由 common/fetch.js 动态加载 common/navbar.html -->
      <div id="navbar"></div>
    </aside>

    <!-- 主内容区：本模块独立设计 -->
    <main class="main">
      <!-- 模块头图 -->
      <section class="module-hero">
        <div class="hero-text">
          <div class="hero-title">仓储管理</div>
          <div class="hero-desc">仓库库存总览 · 进销存台账 · 保税报关节点</div>
        </div>
        <div class="hero-right">
          <a class="hero-entry" href="/warehouse/suppliers.html">供应商列表 →</a>
        </div>
      </section>

      <!-- 库存总览 KPI -->
      <section class="kpi-grid" id="kpi-grid"></section>

      <!-- 仓库库存实时总览（数据来自各仓库分垛明细，调整后即时刷新） -->
      <section class="panel">
        <div class="panel-header">
          <div class="panel-title">仓库库存实时总览</div>
          <div class="stock-head-right">
            <div class="stock-tip">按品类汇总各仓库垛位库存 · 行内「入 / 出」快捷登记出入库</div>
            <button id="ore-manage" type="button" class="io-btn ghost">品类管理</button>
          </div>
        </div>
        <div class="stock-grid" id="stock-grid"></div>
      </section>

      <!-- 进销存台账（入库/出库流水 + 每日盘点 + 导出） -->
      <section class="panel">
        <div class="panel-header">
          <div class="panel-title">进销存台账 · 每日盘点</div>
          <div class="io-toolbar">
            <input id="io-date" class="search-input io-date" type="date" />
            <button id="io-export" type="button" class="io-btn ghost">导出盘点表</button>
            <button id="io-add-out" type="button" class="io-btn out">－ 出库</button>
            <button id="io-add-in" type="button" class="io-btn in">＋ 入库</button>
          </div>
        </div>
        <div class="io-summary" id="io-summary"></div>
        <table class="stack-table io-table" id="io-table"></table>
        <div class="io-sub-title">当日流水明细</div>
        <div class="io-records" id="io-records"></div>
      </section>

      <!-- 保税报关节点（保税物流仓库，单品类 2万吨完成报关） -->
      <section class="panel">
        <div class="panel-header">
          <div class="panel-title">保税报关节点</div>
          <div class="stock-tip">保税货物分品类报关台账 · 单品类累计 2万吨 可完成报关</div>
        </div>
        <div id="customs-body"></div>
      </section>

    </main>
  </div>

  <!-- 弹窗遮罩（出入库 / 品类 / 报关弹窗共用） -->
  <div class="drawer-mask" id="modal-mask" hidden></div>

  <!-- 入库 / 出库登记弹窗 -->
  <div class="modal" id="io-modal" hidden role="dialog" aria-modal="true">
    <div class="modal-head">
      <div class="drawer-title" id="io-title">入库登记</div>
      <button id="io-close" type="button" class="drawer-close" aria-label="关闭">✕</button>
    </div>
    <form id="io-form" class="modal-body io-form">
      <div class="form-item"><label class="form-label">仓库 <span class="required">*</span></label><select id="io-sup" class="form-input"></select></div>
      <div class="form-item"><label class="form-label">品类 <span class="required">*</span></label><input id="io-ore" list="io-ore-list" class="form-input" placeholder="品类，如 PB粉" maxlength="20" autocomplete="off" /><datalist id="io-ore-list"></datalist></div>
      <div class="form-item"><label class="form-label">数量（吨） <span class="required">*</span></label><input id="io-ton" type="number" min="0.1" step="0.1" class="form-input" placeholder="如 1200" /></div>
      <div class="form-item"><label class="form-label">日期</label><input id="io-date-in" type="date" class="form-input" /></div>
      <div class="form-item"><label class="form-label">备注</label><input id="io-note" type="text" class="form-input" placeholder="如 车号 / 船名 / 对接人" maxlength="40" /></div>
      <div class="io-hint" id="io-hint"></div>
      <div class="drawer-footer d-footer">
        <button type="button" id="io-cancel" class="btn-ghost">取消</button>
        <button type="submit" id="io-submit" class="btn-primary">确认入库</button>
      </div>
    </form>
  </div>

  <!-- 矿石品类管理弹窗 -->
  <div class="modal modal-sm" id="ore-modal" hidden role="dialog" aria-modal="true">
    <div class="modal-head">
      <div class="drawer-title">矿石品类管理</div>
      <button id="ore-close" type="button" class="drawer-close" aria-label="关闭">✕</button>
    </div>
    <div class="modal-body">
      <div class="ore-add-row">
        <input id="ore-new" type="text" class="form-input" placeholder="输入新矿石品名，如 卡拉加精粉" maxlength="20" />
        <button id="ore-add" type="button" class="io-btn in">＋ 添加</button>
      </div>
      <div class="ore-catalog" id="ore-catalog"></div>
      <div class="ore-catalog-tip">品名库用于出入库登记时的品类联想；各仓库垛位中已在用的品类会以「在库」标记自动加入联想，登记时也可直接输入全新品名。</div>
    </div>
  </div>

  <!-- 报关登记弹窗 -->
  <div class="modal" id="cd-modal" hidden role="dialog" aria-modal="true">
    <div class="modal-head">
      <div class="drawer-title">报关登记</div>
      <button id="cd-close" type="button" class="drawer-close" aria-label="关闭">✕</button>
    </div>
    <form id="cd-form" class="modal-body">
      <div class="form-item"><label class="form-label">品类 <span class="required">*</span></label><select id="cd-ore" class="form-input"></select></div>
      <div class="form-item"><label class="form-label">报关数量（吨） <span class="required">*</span></label><input id="cd-ton" type="number" min="0.1" step="0.1" class="form-input" placeholder="如 20000" /></div>
      <div class="form-item"><label class="form-label">日期</label><input id="cd-date" type="date" class="form-input" /></div>
      <div class="form-item"><label class="form-label">备注</label><input id="cd-note" type="text" class="form-input" placeholder="如 报关单号 / 车船信息" maxlength="40" /></div>
      <div class="io-hint" id="cd-hint"></div>
      <div class="drawer-footer d-footer">
        <button type="button" id="cd-cancel" class="btn-ghost">取消</button>
        <button type="submit" class="btn-primary">确认报关</button>
      </div>
    </form>
  </div>


  <!-- 公共导航栏加载脚本 -->
  <script src="/common/fetch.js"></script>
  <!-- 模块脚本 -->
  <script src="warehouse.js?v=20261029o"></script>
</body>
</html>
