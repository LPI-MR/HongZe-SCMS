<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>铁路供应商管理 - 泓泽宜通 HongZe-SCMS</title>
  <!-- 公共样式模板：全局变量 / 布局 / 导航 / 组件层 / 门户组件 -->
  <link rel="stylesheet" href="/css/common.css" />
  <!-- 模块独立样式 -->
  <link rel="stylesheet" href="/railway/railway.css" />
</head>
<body data-portal="railway">
  <div class="layout">
    <!-- 左侧公共导航栏 -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-name">泓泽宜通</div>
        <div class="brand-sub">HongZe-SCMS</div>
      </div>
      <!-- 由 common/fetch.js 动态加载 common/navbar.html -->
      <div id="navbar"></div>
    </aside>

    <!-- 主内容区 -->
    <main class="main">
      <!-- 页面标题条 -->
      <div class="ledger-header">
        <div>
          <div class="page-title">铁路供应商管理</div>
          <div class="page-desc">铁路运输服务商主数据库：干线运力资源的权威数据源，支撑火运方案与港口集疏运复用</div>
        </div>
      </div>

      <!-- 供应商检索 -->
      <div class="search-card">
        <div class="search-banner">
          <span class="banner-title">供应商检索</span>
        </div>

        <form class="search-form" id="searchForm">
          <div class="search-field">
            <label class="field-label" for="searchName">企业名称</label>
            <input class="field-input" type="text" id="searchName" placeholder="输入名称模糊搜索" />
          </div>

          <div class="search-field">
            <label class="field-label" for="searchIndustry">国标行业</label>
            <input class="field-input" type="text" id="searchIndustry" placeholder="如：装卸搬运" />
          </div>

          <div class="search-actions">
            <button class="btn btn-primary" type="submit">查询</button>
            <button class="btn btn-ghost" type="reset" id="searchReset">重置</button>
          </div>
        </form>
      </div>

      <!-- 供应商列表 -->
      <div class="ledger-card">
        <div class="ledger-banner">
          <span class="banner-title">供应商列表</span>
          <span class="banner-stat">共 <em id="rsCount">0</em> 家供应商</span>
          <button class="btn btn-ghost banner-action" id="exportBtn" type="button">导出 Excel</button>
          <button class="btn btn-primary banner-action" id="rsAdd" type="button">新增供应商</button>
        </div>

        <div class="table-wrap">
          <table class="ledger-table">
            <thead>
              <tr>
                <th class="col-index">序号</th>
                <th class="col-name">企业名称</th>
                <th class="col-legal">法定代表人</th>
                <th class="col-capital">注册资本</th>
                <th class="col-industry">国标行业</th>
                <th class="col-action">操作</th>
              </tr>
            </thead>
            <tbody>
              <!-- 暂无数据，由 railway.js 数据驱动渲染 -->
              <tr class="empty-row">
                <td colspan="6">暂无供应商数据</td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- 分页控制 -->
        <div class="pager">
          <div class="pager-left">
            <select class="pager-size" id="pageSize">
              <option value="10" selected>10 条/页</option>
              <option value="20">20 条/页</option>
              <option value="50">50 条/页</option>
            </select>
            <span class="pager-total">共 <b id="pagerTotal">0</b> 条记录</span>
          </div>
          <div class="pager-right">
            <button type="button" class="pager-btn" id="pgFirst">首页</button>
            <button type="button" class="pager-btn" id="pgPrev">上一页</button>
            <span class="pager-info">
              第 <input class="pager-input" type="number" id="pgInput" min="1" value="1" />
              / <span id="pgPages">1</span> 页
            </span>
            <button type="button" class="pager-btn" id="pgNext">下一页</button>
            <button type="button" class="pager-btn" id="pgLast">末页</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- 编辑弹窗 -->
  <div class="rs-mask" id="rsMask" hidden>
    <div class="rs-modal">
      <div class="rs-modal-head">
        <div class="rs-modal-title" id="rsModalTitle">编辑</div>
        <button class="rs-modal-close" id="rsModalClose">✕</button>
      </div>
      <div class="rs-modal-body" id="rsModalBody"></div>
      <div class="rs-modal-foot">
        <button class="rs-btn rs-btn-ghost" id="rsModalCancel">取消</button>
        <button class="rs-btn rs-btn-primary" id="rsModalSave">保存</button>
      </div>
    </div>
  </div>

  <div class="rs-toast" id="rsToast"></div>

  <!-- 公共导航栏加载脚本 -->
  <script src="/common/fetch.js"></script>
  <!-- Excel 导出组件（复用 contracts 内置 vendor） -->
  <script src="/contracts/vendor/xlsx.full.min.js"></script>
  <!-- 模块脚本 -->
  <script src="/railway/railway.js"></script>
</body>
</html>
