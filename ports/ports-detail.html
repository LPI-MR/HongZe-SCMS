<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>港口详情 - 泓泽宜通供应链管理系统</title>
  <link rel="stylesheet" href="/css/common.css" />
  <!-- 模块独立样式：与列表页共用 ports.css -->
  <link rel="stylesheet" href="ports.css?v=20261020g" />
</head>
<body>
  <div class="layout">
    <!-- 左侧公共导航栏 -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-name">泓泽宜通</div>
        <div class="brand-sub">HongZe-SCMS</div>
      </div>
      <!-- 由 common/fetch.js 动态加载 common/navbar.html -->
      <div id="navbar"></div>
    </aside>

    <!-- 主内容区：详情容器，由 ports.js 依据 ?id= 参数渲染 -->
    <main class="main">
      <section class="detail-wrap" id="detailWrap">
        <!-- 顶部：操作 -->
        <div class="detail-top">
          <span class="spacer"></span>
          <button class="btn btn-ghost" id="backBtn" type="button">返回列表</button>
        </div>

        <!-- 详情主体：港口概览 / 指标 / 信息卡片 / 港区分部（JS 渲染） -->
        <div id="detailPanel" style="padding-top: var(--space-md);"></div>
      </section>
    </main>
  </div>

  <!-- 编辑弹窗（与列表页共用） -->
  <div class="modal-mask" id="modalMask">
    <div class="modal" id="modalBox"></div>
  </div>

  <!-- 轻提示 -->
  <div class="toast" id="toast"></div>

  <script src="/common/fetch.js"></script>
  <!-- 模块脚本（同文件内自动识别详情模式） -->
  <script src="ports.js?v=20261020f"></script>
</body>
</html>
