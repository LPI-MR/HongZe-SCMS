<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数据分析 - 泓泽宜通 HongZe-SCMS</title>
  <!-- 公共样式模板：全局变量 / 布局 / 导航 / 组件层 / 门户组件 -->
  <link rel="stylesheet" href="/css/common.css" />
</head>
<body data-portal="analytics">
  <div class="layout">
    <!-- 左侧公共导航栏 -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-name">泓泽宜通</div>
        <div class="brand-sub">HongZe-SCMS</div>
      </div>
      <!-- 由 common/fetch.js 动态加载 common/navbar.html -->
      <div id="navbar"></div>
    </aside>

    <!-- 主内容区：统一门户结构（调度 / 财务两个分析入口共用本页） -->
    <main class="main">
      <!-- 模块标题条 -->
      <section class="portal-hero">
        <div class="portal-hero-icon">
          <svg viewBox="0 0 24 24"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M2 20h20"/></svg>
        </div>
        <div class="portal-hero-info">
          <div class="portal-title">数据分析</div>
          <div class="portal-desc">调度数据与财务数据分析</div>
        </div>
        <span class="portal-flag">建设中</span>
      </section>

      <!-- 系统数据概览（portal.js 真实聚合） -->
      <section class="portal-stats" id="portalStats"></section>

      <!-- 规划能力 -->
      <section class="portal-panel">
        <div class="panel-head">
          <div class="panel-title">规划能力</div>
          <div class="panel-sub">模块建设范围</div>
        </div>
        <div class="portal-features" id="portalFeatures"></div>
      </section>

      <!-- 建设说明 -->
      <section class="portal-note">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01"/><path d="M12 11v5"/></svg>
        <span>该模块正在建设中，调度分析、财务分析两个入口建设完成后将拆分为独立页面；数据结构将与合同、矿山、海运模块打通，上线后自动接入系统导航。</span>
      </section>
    </main>
  </div>

  <!-- 公共导航栏加载脚本 -->
  <script src="/common/fetch.js"></script>
  <!-- 门户页通用模板脚本 -->
  <script src="/common/portal.js"></script>
</body>
</html>
